name: Importar tarjeta de itinerario Valeria
on:
  push:
    paths:
      - '.github/workflows/importar-itinerario-valeria.yml'
permissions:
  contents: write
jobs:
  guardar-imagen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar y comprobar la tarjeta corregida
        env:
          ASSET_URL: https://at.adobe.com/p3gv0M8tIIt3bVC6
        run: |
          curl --fail --location --retry 4 --retry-delay 2 "$ASSET_URL" -o itinerario-vestimenta-valeria-2026.png
          echo "4359dbaef30799716aaa4ad3ac7e1b8b7c8eaeecf8159448ac9fd1c99b665a67  itinerario-vestimenta-valeria-2026.png" | sha256sum -c -
      - name: Guardar imagen en la invitación
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add itinerario-vestimenta-valeria-2026.png
          git commit -m "Agregar tarjeta de itinerario y vestimenta corregida"
          git push
